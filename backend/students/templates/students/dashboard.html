
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: 0.4s;
            padding: 20px;
        }

        .dashboard {
            width: 100%;
            max-width: 750px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            text-align: center;
            animation: slideUp 0.8s ease;
            transition: 0.4s;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
        }

        .theme-btn {
            border: none;
            background: #eee;
            padding: 10px 14px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
        }

        .theme-btn:hover {
            transform: rotate(30deg);
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            margin: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            color: white;
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .username {
            color: #667eea;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        .info-box {
            background: #f5f6ff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .clock {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
            margin-top: 8px;
        }

        .logout-btn {
            padding: 13px 35px;
            border: none;
            border-radius: 30px;
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(238,82,83,0.4);
        }

        .logout-btn:active {
            transform: scale(0.95);
        }

        .footer {
            margin-top: 30px;
            color: #999;
            font-size: 13px;
        }

        /* Dark mode */

        body.dark {
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        body.dark .dashboard {
            background: #1e293b;
        }

        body.dark h1 {
            color: white;
        }

        body.dark .subtitle,
        body.dark .footer {
            color: #cbd5e1;
        }

        body.dark .info-box {
            background: #334155;
            color: white;
        }

        body.dark .theme-btn {
            background: #334155;
            color: white;
        }

        @media(max-width: 500px) {
            .dashboard {
                padding: 25px 18px;
            }

            h1 {
                font-size: 25px;
            }

            .username {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="dashboard">

        <div class="top-bar">
            <div class="logo">🎓 Student Portal</div>

            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
                🌙
            </button>
        </div>

        <div class="profile-icon">
            👨‍🎓
        </div>

        <h1 id="welcomeText">Welcome Back!</h1>

        <div class="username">
            {{ user.username }}
        </div>

        <p class="subtitle">
            We're happy to see you again.
            Have a productive day!
        </p>

        <div class="info-box">
            <p>📅 Today's Date</p>
            <div id="date"></div>

            <br>

            <p>⏰ Current Time</p>
            <div class="clock" id="clock"></div>
        </div>

        <form method="POST" action="{% url 'logout' %}"
              onsubmit="return confirmLogout()">

            {% csrf_token %}

            <button type="submit" class="logout-btn">
                Logout 🚪
            </button>

        </form>

        <div class="footer">
            © 2026 Student Portal | All Rights Reserved
        </div>

    </div>

    <script>

        // Live clock

        function updateClock() {
            const now = new Date();

            document.getElementById("clock").textContent =
                now.toLocaleTimeString();

            document.getElementById("date").textContent =
                now.toLocaleDateString('en-IN', {
                    weekday: 'long',
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
        }

        updateClock();
        setInterval(updateClock, 1000);


        // Dark / Light mode

        function toggleTheme() {
            document.body.classList.toggle("dark");

            const isDark =
                document.body.classList.contains("dark");

            document.getElementById("themeBtn").textContent =
                isDark ? "☀️" : "🌙";

            localStorage.setItem("darkMode", isDark);
        }

        // Remember theme preference

        if (localStorage.getItem("darkMode") === "true") {
            document.body.classList.add("dark");
            document.getElementById("themeBtn").textContent = "☀️";
        }


        // Logout confirmation

        function confirmLogout() {
            return confirm("Are you sure you want to logout?");
        }

    </script>

</body>
</html>
