
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Students</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
            font-size: 28px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #667eea;
            color: white;
            padding: 15px;
            text-align: left;
            font-size: 16px;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #ddd;
            color: #444;
            font-size: 15px;
        }

        tr:nth-child(even) {
            background-color: #f5f6ff;
        }

        tr:hover {
            background-color: #e8eaff;
            transition: 0.3s;
        }

        .empty {
            text-align: center;
            color: #888;
            padding: 25px;
            font-size: 16px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }

            h2 {
                font-size: 23px;
            }

            th, td {
                padding: 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Registered Students</h2>

        <div class="table-container">
            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Department</th>
                    </tr>
                </thead>

                <tbody>

                    {% for student in students %}

                    <tr>
                        <td>{{ student.name }}</td>
                        <td>{{ student.email }}</td>
                        <td>{{ student.age }}</td>
                        <td>{{ student.department }}</td>
                    </tr>

                    {% empty %}

                    <tr>
                        <td colspan="4" class="empty">
                            No students found
                        </td>
                    </tr>

                    {% endfor %}

                </tbody>

            </table>
        </div>

        <div class="footer">
            Student Management System
        </div>

    </div>

</body>
</html>
